sonar.projectKey=Calculator-App
sonar.projectName=Calculator App
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/main.ts
sonar.sourceEncoding=UTF-8

# Coverage from `npm run test:ci` (karma.conf.js writes lcov here)
sonar.javascript.lcov.reportPaths=coverage/calculator-app/lcov.info
